/* ============================================================
   6. MUTATIONS — every change goes through the ledger
   ============================================================ */
function addMovement(m){
  const rec = Object.assign({id:uid("mov"), ts:nowTs(), kind:"adjust", reason:"", itemType:"variant", itemId:"", qty:0,
    unitCost:null, unitPrice:null, channelId:"", batchId:null, poId:null, transactionId:"", note:""}, m);
  state.movements.push(rec);
  save();
  return rec;
}
function recordIn({type,id,qty,unitCost,reason,note,madeDate,expiryDate,batchNo,poId}){
  qty = parseUserNum(qty, NaN);
  if(!["variant","material"].includes(type) || !id || !itemOf(type,id)) return {ok:false, msg:"Pick a valid item first."};
  if(!Number.isFinite(qty) || qty<=0) return {ok:false, msg:"Quantity must be a number above zero."};
  let parsedCost = null;
  if(unitCost!=null && unitCost!==""){
    parsedCost = parseUserNum(unitCost, NaN);
    if(!Number.isFinite(parsedCost) || parsedCost<0) return {ok:false, msg:"Unit cost must be a valid amount of zero or more."};
  }
  let batchId = null;
  if(type==="variant" && (batchNo || madeDate || expiryDate)){
    const b = {id:uid("bat"), variantId:id, batchNo:batchNo || ("B"+todayISO().replace(/-/g,"").slice(2)),
      madeDate: madeDate||todayISO(), expiryDate: expiryDate||"", qtyReceived:qty};
    state.batches.push(b); batchId = b.id;
  }
  const m = addMovement({kind:"in", reason:reason||"Delivery", itemType:type, itemId:id, qty,
    unitCost: parsedCost, batchId, poId:poId||null, note:note||""});
  return {ok:true, m};
}
function recordOut(lines, note=""){
  const errors = [], created = [], totals = new Map();
  if (!Array.isArray(lines) || !lines.length) return {ok:false, errors:["Add at least one stock-out line."], created};
  for (const l of lines){
    if (!l || !["variant","material"].includes(l.type) || !l.id || !itemOf(l.type,l.id)){
      errors.push("One line has no valid item picked — remove it or choose an item."); continue;
    }
    const q = parseUserNum(l.qty, NaN), normalizedQty=round2(q);
    if (!Number.isFinite(q) || !Number.isFinite(normalizedQty) || normalizedQty<=0){ errors.push(`${itemLabel(l.type,l.id).name}: quantity must be a number of at least 0.01.`); continue; }
    if (l.unitPrice!=null && l.unitPrice!==""){
      const price = parseUserNum(l.unitPrice, NaN);
      if (!Number.isFinite(price) || price<0){ errors.push(`${itemLabel(l.type,l.id).name}: sale price must be zero or more.`); continue; }
      l.unitPrice = price;
    }
    l.qty = normalizedQty;
    const key = l.type+":"+l.id;
    totals.set(key, (totals.get(key)||0)+l.qty);
  }
  if (!errors.length && !state.settings.allowNegative){
    for (const [key,qty] of totals){
      const [type,id] = key.split(":");
      const stock = stockOf(type,id);
      if (stock + 1e-9 < qty) errors.push(`${itemLabel(type,id).name}: ${fmtQty(stock)} on hand, but ${fmtQty(qty)} requested across these lines. Reduce the quantity or allow negative stock in Settings.`);
    }
  }
  if (errors.length) return {ok:false, errors, created:[]};
  const transactionId = uid("txn");
  for (const l of lines){
    if (l.type === "variant"){
      const {plan, unbatched} = fefoAllocate(l.id, l.qty);
      const base = {kind:"out", reason:l.reason||"Sale", itemType:"variant", itemId:l.id,
        unitCost:avgCostOf("variant",l.id), unitPrice: l.unitPrice==null||l.unitPrice===""?null:Number(l.unitPrice),
        channelId:l.channelId||"", transactionId, note:l.note||note||""};
      for (const p of plan) created.push(addMovement({...base, qty:-p.qty, batchId:p.batchId}));
      if (unbatched > 0) created.push(addMovement({...base, qty:-unbatched, batchId:null}));
    } else {
      created.push(addMovement({kind:"out", reason:l.reason||"Internal use", itemType:"material", itemId:l.id, qty:-l.qty,
        unitCost:avgCostOf("material",l.id), transactionId, note:l.note||note||""}));
    }
  }
  if (created.length) save();
  return {ok:created.length>0, errors:[], created};
}
function produceUnits(productId, variantId, units){
  const variant=variantById(variantId);
  if(!variant || variant.productId!==productId) return {ok:false,msg:"Choose a variant that belongs to this product."};
  const bom = bomFor(productId, variantId);
  if (!bom || !bomRequirements(bom).length) return {ok:false, msg:"No bill of materials yet — add materials to this product first."};
  units=parseUserNum(units,NaN);
  if(!Number.isFinite(units) || !Number.isInteger(units) || units<=0) return {ok:false,msg:"Enter a whole number of units above zero."};
  const short = bomShortfall(bom, units);
  if (short.length) return {ok:false, short, msg:"Not enough materials for this run yet."};
  const perUnit = productionCost(bom);
  const created = [];
  for (const it of bomRequirements(bom)){
    created.push(addMovement({kind:"consume", reason:"Production", itemType:"material", itemId:it.materialId,
      qty:-round2(it.qtyPer*units), unitCost:avgCostOf("material",it.materialId), note:"Production run"}));
  }
  created.push(addMovement({kind:"production", reason:"Production", itemType:"variant", itemId:variantId, qty:units, unitCost:perUnit, note:"Production run"}));
  return {ok:true, created};
}
function adjustItem(type, id, counted, note=""){
  counted = parseUserNum(counted, NaN);
  if (!itemOf(type,id)) return {ok:false, msg:"Choose a valid item first."};
  if (!Number.isFinite(counted)) return {ok:false, msg:"Enter a valid counted quantity."};
  if (counted<0) return {ok:false, msg:"Counted quantity cannot be below zero."};
  const diff = round2(counted - stockOf(type, id));
  if (diff === 0) return {ok:true, msg:"Spot on — no adjustment needed."};
  addMovement({kind:"adjust", reason: note || "Stock-take", itemType:type, itemId:id, qty:diff, unitCost:avgCostOf(type,id)});
  return {ok:true};
}
function writeOffBatch(batchId){
  const b = byId(state.batches, batchId); if (!b) return {ok:false};
  const rem = batchRemaining(b); if (rem <= 0) return {ok:false, msg:"This batch is already empty."};
  addMovement({kind:"out", reason:"Expired write-off", itemType:"variant", itemId:b.variantId, qty:-rem, batchId:b.id,
    unitCost:avgCostOf("variant", b.variantId), note:"Batch "+b.batchNo+" expired"});
  return {ok:true};
}

function chooseModal({title, msg="", choices}){
  return new Promise(resolve=>{
    let done=false; const finish=v=>{ if(done) return; done=true; resolve(v); };
    openModal({title, slim:true, body:`<p style="margin:0">${msg}</p>`,
      footer: choices.map(c=>`<button class="btn ${c.cls||"btn-ghost"}" type="button" data-ch="${escAttr(c.val)}">${c.ic?icon(c.ic,14):""}${esc(c.label)}</button>`).join(""),
      onOpen(root){ root.addEventListener("click", e=>{ const b=e.target.closest("[data-ch]"); if(!b) return; finish(b.dataset.ch); closeModal(); }); },
      onClose(){ finish(null); }});
  });
}
function deleteProductHard(id){
  const product = productById(id); if (!product) return;
  const variants = state.variants.filter(v=>v.productId===id);
  const variantIds = new Set(variants.map(v=>v.id));
  const snap = {
    product:clone(product), variants:clone(variants), bom:clone(state.bom.filter(b=>b.productId===id)),
    movements:clone(state.movements.filter(m=>m.itemType==="variant"&&variantIds.has(m.itemId))),
    batches:clone(state.batches.filter(b=>variantIds.has(b.variantId))),
    listings:clone(state.listings.filter(l=>variantIds.has(l.variantId))), counts:[], purchaseOrders:[]
  };
  state.counts.forEach(c=>{
    const removed=c.lines.filter(l=>l.itemType==="variant"&&variantIds.has(l.itemId));
    if(removed.length){ snap.counts.push({id:c.id,lines:clone(removed)}); c.lines=c.lines.filter(l=>!(l.itemType==="variant"&&variantIds.has(l.itemId))); }
  });
  state.purchaseOrders.forEach(po=>{
    const removed=po.lines.filter(l=>l.itemType==="variant"&&variantIds.has(l.itemId));
    if(removed.length) snap.purchaseOrders.push({id:po.id,po:clone(po),lines:clone(removed)});
    if(removed.length) po.lines=po.lines.filter(l=>!(l.itemType==="variant"&&variantIds.has(l.itemId)));
  });
  state.products=state.products.filter(p=>p.id!==id);
  state.variants=state.variants.filter(v=>v.productId!==id);
  state.bom=state.bom.filter(b=>b.productId!==id);
  state.movements=state.movements.filter(m=>!(m.itemType==="variant"&&variantIds.has(m.itemId)));
  state.batches=state.batches.filter(b=>!variantIds.has(b.variantId));
  state.listings=state.listings.filter(l=>!variantIds.has(l.variantId));
  state.purchaseOrders=state.purchaseOrders.filter(po=>po.lines.length>0);
  save(); render();
  pushUndo(`Deleted ${snap.product.name}`, ()=>{
    state.products.push(clone(snap.product)); state.variants.push(...clone(snap.variants)); state.bom.push(...clone(snap.bom));
    state.movements.push(...clone(snap.movements)); state.batches.push(...clone(snap.batches)); state.listings.push(...clone(snap.listings));
    snap.counts.forEach(saved=>{const c=byId(state.counts,saved.id); if(c)c.lines.push(...clone(saved.lines));});
    snap.purchaseOrders.forEach(saved=>{
      const po=byId(state.purchaseOrders,saved.id);
      if(po) po.lines.push(...clone(saved.lines)); else state.purchaseOrders.push(clone(saved.po));
    });
    save(); render();
  });
}
async function deleteProductFlow(id){
  const p = productById(id); if (!p) return;
  const variantIds = new Set(allVariantsOfProduct(id).map(v=>v.id));
  const hasMovs = state.movements.some(m => m.itemType==="variant" && variantIds.has(m.itemId));
  const hasLinks = hasMovs || state.batches.some(b=>variantIds.has(b.variantId)) || state.listings.some(l=>variantIds.has(l.variantId)) || state.bom.some(b=>b.productId===id) || state.counts.some(c=>c.lines.some(l=>l.itemType==="variant"&&variantIds.has(l.itemId))) || state.purchaseOrders.some(po=>po.lines.some(l=>l.itemType==="variant"&&variantIds.has(l.itemId)));
  if (hasLinks){
    const c = await chooseModal({title:"Delete "+p.name+"?",
      msg:"This product has stock history or linked records. Archiving preserves them; deleting everything removes the linked history, batches, listings, count lines and purchase orders too.",
      choices:[{val:"archive",label:"Archive it",cls:"btn-primary",ic:"save"},{val:"all",label:"Delete everything",cls:"btn-danger",ic:"trash"},{val:"cancel",label:"Keep it"}]});
    if (c==="archive"){
      p.active = false; save(); render();
      pushUndo(`Archived ${p.name}`, ()=>{ p.active = true; save(); render(); });
    } else if (c==="all") deleteProductHard(id);
  } else {
    const ok = await confirmModal({title:"Delete "+p.name+"?", msg:"This product has no history — it will be gone for good.", okLabel:"Delete", danger:true, okIc:"trash"});
    if (ok) deleteProductHard(id);
  }
}
function deleteVariantFlow(id){
  const v = variantById(id); if (!v) return;
  const hasMovs = state.movements.some(m=>m.itemType==="variant" && m.itemId===id);
  const hasRefs = state.batches.some(b=>b.variantId===id) || state.listings.some(l=>l.variantId===id) || state.bom.some(b=>b.variantId===id) || state.counts.some(c=>c.lines.some(l=>l.itemType==="variant"&&l.itemId===id)) || state.purchaseOrders.some(po=>po.lines.some(l=>l.itemType==="variant"&&l.itemId===id));
  if (hasMovs || hasRefs){
    chooseModal({title:"Archive this variant?", msg:esc(v.name)+" has stock history or linked records, so it will be archived instead of deleted. Archived variants disappear from daily lists but history stays correct.",
      choices:[{val:"archive",label:"Archive",cls:"btn-primary",ic:"save"},{val:"cancel",label:"Keep as is"}]})
    .then(c=>{ if(c==="archive"){ v.active=false; save(); render(); pushUndo(`Archived ${v.name}`, ()=>{ v.active=true; save(); render(); }); }});
  } else {
    confirmModal({title:"Delete "+v.name+"?", msg:"No history on this variant — safe to remove.", okLabel:"Delete", danger:true, okIc:"trash"})
      .then(ok=>{ if(!ok) return;
        const idx=state.variants.findIndex(x=>x.id===id); const snap=clone(state.variants[idx]);
        state.variants.splice(idx,1);
        save(); render();
        pushUndo(`Deleted ${snap.name}`, ()=>{ state.variants.push(snap); save(); render(); });
      });
  }
}
function deleteMaterialFlow(id){
  const m = materialById(id); if (!m) return;
  const hasMovs = state.movements.some(x=>x.itemType==="material" && x.itemId===id);
  const activePO = state.purchaseOrders.some(po=>!['received','cancelled'].includes(poEffectiveStatus(po)) && po.lines.some(l=>l.itemType==="material"&&l.itemId===id));
  if(activePO){ toast("This material is on an open purchase order. Receive or cancel that order before deleting the material.",{ic:"warn"}); return; }
  confirmModal({
    title:"Delete "+m.name+"?",
    msg: hasMovs ? "This material has movement history. Past records will keep working (shown as a deleted item), but it will disappear from lists."
                 : "This material has no history — safe to remove.",
    okLabel:"Delete", danger:true, okIc:"trash"})
  .then(ok=>{ if(!ok) return;
    const idx=state.materials.findIndex(x=>x.id===id); const snap=clone(state.materials[idx]);
    const bomRefs=state.bom.filter(b=>b.items.some(i=>i.materialId===id)).map(b=>({id:b.id,items:clone(b.items.filter(i=>i.materialId===id))}));
    state.materials.splice(idx,1);
    state.bom.forEach(b=>{ b.items = b.items.filter(i=>i.materialId!==id); });
    save(); render();
    pushUndo(`Deleted ${snap.name}`, ()=>{ state.materials.push(snap); bomRefs.forEach(ref=>{const b=byId(state.bom,ref.id); if(b)b.items.push(...clone(ref.items));}); save(); render(); });
  });
}
const genericDelete = (listName, arr, id, label, rebuild) => {
  const idx = arr.findIndex(x=>x.id===id); if (idx<0) return;
  const snap = clone(arr[idx]);
  const inUse = typeof rebuild==="function" ? rebuild(snap) : false;
  if (inUse){
    toast(`${label} is still in use by other records, so it stays.`, {ic:"info"});
    return;
  }
  arr.splice(idx,1); save(); render();
  pushUndo(`Deleted ${label}`, ()=>{ arr.push(snap); save(); render(); });
};

function cleanSkuPart(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function skuFromPattern(p, v){
  const cat = categoryById(p.categoryId)?.name || "GEN";
  let sku = (state.settings.skuPattern || "{CAT}-{NAME}-{VARIANT}-{SEQ}")
    .replace("{CAT}", cleanSkuPart(cat).slice(0,6) || "GEN")
    .replace("{NAME}", cleanSkuPart(p.name).slice(0,10) || "ITEM")
    .replace("{VARIANT}", cleanSkuPart(v.name).slice(0,12) || "STD")
    .replace("{SEQ}", String(state.settings.skuSeq||1).padStart(4,"0"));
  state.settings.skuSeq = (state.settings.skuSeq||1) + 1;
  const all = new Set([...state.variants.map(x=>x.sku), ...state.materials.map(x=>x.sku)].filter(Boolean));
  if (all.has(sku)){ let i=2; while (all.has(sku+"-"+i)) i++; sku = sku+"-"+i; }
  return sku;
}

const DRAFT_IN  = {item:"", qty:"", cost:"", reason:"Delivery", batchNo:"", made:"", expiry:"", note:""};

function itemOptions(sel=""){
  const g = state.products.filter(p=>p.active!==false).map(p=>{
    const vs = variantsOfProduct(p.id);
    if (!vs.length) return "";
    return `<optgroup label="${escAttr(p.name)}">${vs.map(v=>`<option value="variant:${escAttr(v.id)}" ${sel==="variant:"+v.id?"selected":""}>${escAttr(v.name)}${v.sku?" — "+escAttr(v.sku):""} · ${fmtQty(stockOf("variant",v.id))} on hand</option>`).join("")}</optgroup>`;
  }).join("");
  const mats = state.materials.length ? `<optgroup label="Raw materials">${state.materials.map(m=>`<option value="material:${escAttr(m.id)}" ${sel==="material:"+m.id?"selected":""}>${escAttr(m.name)}${m.sku?" — "+escAttr(m.sku):""} · ${fmtQty(stockOf("material",m.id))} ${escAttr(m.unit)}</option>`).join("")}</optgroup>` : "";
  return `<option value="">Choose an item…</option>` + g + mats;
}
function findItemByCode(code){
  const c = String(code||"").trim().toLowerCase();
  if (!c) return null;
  for (const v of state.variants) if (v.sku.toLowerCase()===c || (v.barcode && v.barcode.toLowerCase()===c)) return {type:"variant", id:v.id};
  for (const m of state.materials) if (m.sku && m.sku.toLowerCase()===c) return {type:"material", id:m.id};
  for (const v of state.variants) if (v.name.toLowerCase()===c) return {type:"variant", id:v.id};
  for (const p of state.products) if (p.name.toLowerCase()===c){
    const vs = variantsOfProduct(p.id); if (vs.length===1) return {type:"variant", id:vs[0].id};
  }
  return null;
}
function bindScan(root){
  $$("[data-scan]", root).forEach(inp=>{
    if (inp._scanBound) return; inp._scanBound = true;
    inp.addEventListener("keydown", e=>{
      if (e.key !== "Enter") return;
      e.preventDefault();
      const hit = findItemByCode(inp.value);
      const sel = $(inp.dataset.target, root);
      if (hit && sel){ sel.value = hit.type+":"+hit.id; sel.dispatchEvent(new Event("change",{bubbles:true})); inp.value=""; toast("Found: "+itemLabel(hit.type,hit.id).name, {ic:"scan"}); focusMe(sel.closest(".field")?.parentElement?.querySelector("input[type=number]") || $("input[type=number]", root)); }
      else toast("Nothing matches “"+inp.value+"”. Check the SKU or barcode.", {ic:"warn"});
    });
  });
}

function poSave(id, status){

  if(existing && (["received","cancelled"].includes(poEffectiveStatus(existing)))){
    toast("Fully received or cancelled purchase orders cannot be edited.",{ic:"warn"}); return;
  }
  const lines = [], errors=[];
  $$('[data-polrow]').forEach((r,i)=>{
    const selected=$("[data-pl='itemId']",r).value||"";
    const qtyText=$("[data-pl='qty']",r).value.trim();
    const costText=$("[data-pl='unitCost']",r).value.trim();

    if(!Number.isFinite(qty) || qty<=0){ errors.push(`Line ${i+1}: quantity must be a number above zero.`); return; }
    if(!Number.isFinite(unitCost) || unitCost<0){ errors.push(`Line ${i+1}: unit cost must be zero or more.`); return; }

  });

  if(!lines.length){ toast("Add at least one line with an item and quantity.", {ic:"warn"}); return; }

  const shipping=shippingText===""?0:parseUserNum(shippingText,NaN);
  if(!Number.isFinite(shipping)||shipping<0){toast("Shipping cost must be zero or more.",{ic:"warn"});return;}
  if(existing){
    const receivedByKey=new Map();
    existing.lines.forEach(l=>{const k=l.itemType+":"+l.itemId;receivedByKey.set(k,(receivedByKey.get(k)||0)+Math.max(0,Number(l.received)||0));});
    const newQtyByKey=new Map();
    lines.forEach(l=>{const k=l.itemType+":"+l.itemId;newQtyByKey.set(k,(newQtyByKey.get(k)||0)+l.qty);});
    for(const [k,received] of receivedByKey){
      if(received>(newQtyByKey.get(k)||0)+1e-9){const [type,itemId]=k.split(":");toast(`You cannot reduce ${itemLabel(type,itemId).name} below the quantity already received (${fmtQty(received)}).`,{ic:"warn",ms:6000});return;}
    }
    for(const l of lines){const k=l.itemType+":"+l.itemId;const left=receivedByKey.get(k)||0;l.received=Math.min(l.qty,left);receivedByKey.set(k,Math.max(0,left-l.received));}
    const hadReceived=sumBy(lines,l=>l.received);
    let nextStatus=existing.status;
    if(status==="ordered" && existing.status==="draft") nextStatus="ordered";
    if(hadReceived>0){const total=sumBy(lines,l=>l.qty);nextStatus=hadReceived>=total?"received":"partial";}
    Object.assign(existing,{supplierId,expectedDate:fv("f_exp"),shipping:round2(shipping),note:fv("f_note"),lines,status:nextStatus});
    if(status==="ordered" && !existing.orderedTs) existing.orderedTs=nowTs();
    toast(existing.number+" updated.");
  } else {
    const seq = state.purchaseOrders.length + 1;
    const po = Object.assign({id:uid("po"), number:"PO-"+String(seq).padStart(3,"0"), status,
      createdTs:nowTs(), orderedTs: status==="ordered"?nowTs():null},
      {supplierId,expectedDate:fv("f_exp"),shipping:round2(shipping),note:fv("f_note"),lines});

  }

}

function poReceiveSave(poId){
  const po = byId(state.purchaseOrders, poId);
  if (!po){ toast("This purchase order no longer exists.",{ic:"warn"}); return; }
  if(["received","cancelled"].includes(poEffectiveStatus(po))){toast("This purchase order is already closed.",{ic:"warn"});return;}
  const rows=$$('[data-rcv]'), inputs=[], errors=[];
  rows.forEach(row=>{
    const i=Number(row.dataset.rcv), l=po.lines[i]; if(!l)return;
    const q=parseUserNum($("[data-rk='qty']",row).value,NaN);
    const costText=$("[data-rk='cost']",row).value.trim();
    const cost=costText===""?null:parseUserNum(costText,NaN);
    const remaining=Math.max(0,Number(l.qty)-(Number(l.received)||0));
    if(!Number.isFinite(q)||q<0){errors.push(`Line ${i+1}: receive quantity must be zero or more.`);return;}
    if(q>remaining+1e-9){errors.push(`Line ${i+1}: only ${fmtQty(remaining)} units remain to receive.`);return;}
    if(cost!==null&&(!Number.isFinite(cost)||cost<0)){errors.push(`Line ${i+1}: unit cost must be zero or more.`);return;}
    if(q>0&&!itemOf(l.itemType,l.itemId)){errors.push(`Line ${i+1}: the item no longer exists.`);return;}
    inputs.push({row,i,l,q,costText,cost});
  });
  if(errors.length){toast(errors[0],{ic:"warn",ms:6000});return;}
  const positive=inputs.filter(x=>x.q>0);
  if(!positive.length){toast("Nothing to receive — quantities were zero.",{ic:"info"});return;}
  for(const x of positive){
    const {row,l,q,costText,cost}=x;
    const rec=recordIn({type:l.itemType,id:l.itemId,qty:q,unitCost:costText,reason:"PO delivery",poId:po.id,note:po.number,
      batchNo:$("[data-rk='batchNo']",row)?.value||"",expiryDate:$("[data-rk='expiry']",row)?.value||""});
    if(!rec.ok){toast(rec.msg||"A receipt could not be recorded.",{ic:"warn"});return;}
    l.received=round2((l.received||0)+q);
    if(cost!==null)l.unitCost=cost;
  }
  const total=sumBy(po.lines,l=>l.qty), recv=sumBy(po.lines,l=>l.received||0);
  if(recv>=total-1e-9 && total>0)po.status="received";
  else if(recv>0)po.status="partial";
  save(); closeModal(); render();
  const any=sumBy(positive,x=>x.q);
  toast(`${fmtQty(any)} units received into stock. ${po.status==="received"?po.number+" is complete.":"The rest stays open."}`,{ic:"down"});
}
function createPOsFromReorder(selIds, qtyMap={}){
  const groups = {};
  let noSup = 0;
  for (const key of selIds){
    const [type,id] = key.split(":");
    const it = itemOf(type,id); if (!it) continue;
    const sid = it.supplierId || "";
    if (!sid){ noSup++; continue; }
    (groups[sid] ||= []).push({type, id});
  }
  const made = [];
  for (const [sid, items] of Object.entries(groups)){
    const sup = supplierById(sid);
    const seq = state.purchaseOrders.length + 1;
    const po = {id:uid("po"), number:"PO-"+String(seq).padStart(3,"0"), supplierId:sid, status:"draft",
      createdTs:nowTs(), orderedTs:null, expectedDate:addDaysISO(todayISO(), Math.max(3, sup?.leadDays||7)),
      lines: items.map(({type,id})=>{
        const it = itemOf(type,id);
        const q = Math.max(1, Math.floor(qtyMap[type+":"+id] ?? suggestedQty(type,id)));
        return {itemType:type, itemId:id, qty:q, unitCost: isMaterial(type) ? (it.cost||0) : avgCostOf(type,id), received:0};
      }), shipping:0, note:"Created from low-stock suggestions."};
    state.purchaseOrders.push(po); made.push(po.number);
  }
  save();
  if (made.length) toast(`${made.length} draft ${plural(made.length,"purchase order")} created — review and send when ready.`, {ic:"cart"});
  if (noSup) toast(`${noSup} ${plural(noSup,"item")} skipped — no supplier set yet.`, {ic:"info"});
  if (made.length) location.hash = "#orders";
  else render();
}

function productStatus(p){
  const vs = allVariantsOfProduct(p.id);
  if (!vs.length) return {st:"ok", stock:0};
  let worst = "ok", stock = 0;
  for (const v of vs){
    const st = statusOf("variant", v.id);
    stock += Math.max(0, stockOf("variant", v.id));
    if (st === "out") worst = "out";
    else if (st === "low" && worst !== "out") worst = "low";
  }
  return {st:worst, stock:round2(stock)};
}

const PF = () => (TSTATE.prodFilters ||= {cat:"", loc:"", status:"", sup:""});
function filteredProducts(){
  const f = PF();
  return state.products.filter(p=>{
    if (f.cat && p.categoryId !== f.cat) return false;
    if (f.loc && p.locationId !== f.loc) return false;
    if (f.sup && !allVariantsOfProduct(p.id).some(v=>v.supplierId===f.sup)) return false;
    const st = productStatus(p);
    if (f.status === "archived" && p.active !== false) return false;
    if (f.status === "active" && p.active === false) return false;
    if ((f.status==="ok"||f.status==="low"||f.status==="out") && (p.active===false || st.st!==f.status)) return false;
    return true;
  });
}

}

      ${fld("Value", `<input id="f_val" class="input" type="number" step="0.01" placeholder="10">`,"Applies to all active variants with a price. Cost is left alone.","mt12")}
      <label class="switch mt12"><input type="checkbox" id="f_round" checked><span class="tr"></span> Round to whole ${state.settings.currency==="USD"?"dollars":"units"}</label>`,

function bulkPriceApply(){
  const op = fv("f_op"), val = fn("f_val"), round = checked("f_round");
  if (isNaN(val)){ toast("Enter a number first.", {ic:"warn"}); return; }
  const before = state.variants.map(v=>({id:v.id, price:v.price}));
  let n = 0;
  for (const v of state.variants){
    if (v.active===false) continue;
    let p = v.price;
    if (op==="inc") p = p * (1 + val/100);
    if (op==="dec") p = p * (1 - val/100);
    if (op==="set") p = val;
    if (round) p = Math.round(p);
    p = Math.max(0, round2(p));
    if (p !== v.price){ v.price = p; n++; }
  }
  closeModal(); save(); render();
  if (!n){ toast("No prices needed changing.", {ic:"info"}); return; }
  pushUndo(`Changed ${n} prices`, ()=>{ for (const b of before){ const v = variantById(b.id); if (v) v.price = b.price; } save(); render(); });
  toast(`${n} ${plural(n,"price")} updated.`, {ic:"check"});
}

/* ---------- SUPPLIERS ---------- */
function supplierStats(s){
  const pos = state.purchaseOrders.filter(p=>p.supplierId===s.id);
  const received = pos.filter(p=>poEffectiveStatus(p)==="received");
  const spent = pos.reduce((a,p)=>a + sumBy(p.lines.filter(l=>l.received>0), l=>l.received*l.unitCost) + (poEffectiveStatus(p)==="received"?(Number(p.shipping)||0):0), 0);
  let leadSum=0, leadN=0;
  for (const po of received){
    const dts = Math.max(...state.movements.filter(m=>m.poId===po.id).map(m=>m.ts), 0);
    if (dts && po.orderedTs){ leadSum += Math.max(0, Math.round((dts-po.orderedTs)/DAY_MS)); leadN++; }
  }
  return {pos, open: pos.filter(p=>["draft","ordered","partial"].includes(poEffectiveStatus(p))).length,
    spent: round2(spent), leadAvg: leadN ? Math.round(leadSum/leadN) : null, leadN,
    items: state.variants.filter(v=>v.supplierId===s.id).length + state.materials.filter(m=>m.supplierId===s.id).length};
}

function channelsSave(){
  const before = clone(state.listings);
  const seen = {};
  $$("[data-list]").forEach(inp=>{
    const [vid, cid] = inp.dataset.list.split(":");
    if (!vid || !cid) return;
    const q = Math.max(0, Math.floor(parseUserNum(inp.value)));
    if (q>0) seen[vid+":"+cid] = q;
  });
  state.listings = Object.entries(seen).map(([k,qty])=>{ const [variantId, channelId] = k.split(":"); return {variantId, channelId, qty}; });
  save(); render();
  pushUndo("Updated channel listings", ()=>{ state.listings = before; save(); render(); });
  toast("Listings saved — channels now match the plan.", {ic:"store"});
}
function channelEven(id, mode){
  const v = variantById(id); if (!v) return;
  const stock = Math.max(0, Math.floor(stockOf("variant", id)));
  state.listings = state.listings.filter(l=>l.variantId!==id);
  if (mode==="onhand"){
    state.channels.forEach(c=>{ if (stock>0) state.listings.push({variantId:id, channelId:c.id, qty:stock}); });
  } else {
    const n = Math.max(1, state.channels.length);
    const each = Math.floor(stock/n); let rest = stock;
    state.channels.forEach(c=>{ const q = each + (rest>0?0:0); if (q>0){ state.listings.push({variantId:id, channelId:c.id, qty:q}); rest -= q; } });
    /* remainder to first channel */
    if (rest>0 && state.listings.find(l=>l.variantId===id)) state.listings.find(l=>l.variantId===id).qty += rest;
    else if (rest>0 && state.channels[0]) state.listings.push({variantId:id, channelId:state.channels[0].id, qty:rest});
  }
  save(); render();
  toast(mode==="onhand" ? "All channels now list the full on-hand count." : "Split evenly across channels.", {ic:"store"});
}

function analyticsRange(period = (TSTATE.period ||= {k:"30", from:"", to:""})){
  const today = todayISO();
  let fromISO = "", toISO = today, label = "", days = 0;
  if (period.k === "custom") {
    fromISO = period.from || "";
    toISO = period.to || "";
    if (!fromISO || !toISO || fromISO > toISO) {
      return {valid:false, fromISO, toISO, fromMs:0, toExclusiveMs:0, days:0, label:"Custom date range", monthly:false};
    }
    days = daysBetween(fromISO, toISO) + 1;
    label = `${fmtDate(fromISO,"short")} – ${fmtDate(toISO,"short")}`;
  } else if (period.k === "year" || period.k === "365") {
    const now = new Date();
    fromISO = `${now.getFullYear()}-01-01`;
    toISO = today;
    days = Math.max(1, daysBetween(fromISO, toISO) + 1);
    label = `Year to date · ${fmtDate(fromISO,"short")} – ${fmtDate(toISO,"short")}`;
  } else {
    days = clamp(Math.floor(Number(period.k) || 30), 1, 3660);
    fromISO = addDaysISO(today, -(days - 1));
    toISO = today;
    label = `Last ${days} days`;
  }
  return {valid:true, fromISO, toISO, fromMs:parseISO(fromISO).getTime(), toExclusiveMs:parseISO(addDaysISO(toISO,1)).getTime(), days, label, monthly:days>90};
}
function analyticsMovements(range){
  if (!range.valid) return [];
  return state.movements.filter(m => m.ts >= range.fromMs && m.ts < range.toExclusiveMs);
}
function analyticsSalesMovements(range){
  return analyticsMovements(range).filter(m => m.kind === "out" && m.reason === "Sale");
}
function analyticsStats(range){
  const sales = analyticsSalesMovements(range);
  const revenue = round2(sumBy(sales, m => (-m.qty) * (m.unitPrice||0)));
  const cogs = round2(sumBy(sales, m => (-m.qty) * (m.unitCost ?? avgCostOf(m.itemType,m.itemId))));
  const unitsSold = round2(sumBy(sales, m => -m.qty));
  const orders = new Set(sales.map(m => m.transactionId || ("legacy:"+monthKey(m.ts)+m.channelId+isoOf(new Date(m.ts))))).size;
  const invVal = stockValueTotal();
  const perDay = range.days > 0 ? cogs/range.days : 0;
  return {revenue,cogs,profit:round2(revenue-cogs),unitsSold,aov:orders?round2(revenue/orders):0,orders,
    turnover:invVal>0?round2(perDay*30/invVal):0,daysOfStock:perDay>0?Math.round(invVal/perDay):null,invVal};
}
function analyticsChannelSales(range){
  const sales = analyticsSalesMovements(range);
  return state.channels.map(ch=>{
    const mine=sales.filter(m=>m.channelId===ch.id);
    const units=round2(sumBy(mine,m=>-m.qty));
    const revenue=round2(sumBy(mine,m=>(-m.qty)*(m.unitPrice||0)));
    const cogs=round2(sumBy(mine,m=>(-m.qty)*(m.unitCost??avgCostOf(m.itemType,m.itemId))));
    const txnCount=new Set(mine.map(m=>m.transactionId||("legacy:"+monthKey(m.ts)+ch.id+isoOf(new Date(m.ts))))).size;
    const fees=round2(revenue*(Number(ch.feePct)||0)/100+txnCount*(Number(ch.feeFixed)||0));
    return {ch,units,revenue,cogs,fees,net:round2(revenue-cogs-fees),count:txnCount};
  }).sort((a,b)=>b.revenue-a.revenue);
}
function analyticsTopSellers(range,n=8){
  const groups={};
  for(const m of analyticsSalesMovements(range)){
    const k=m.itemType+":"+m.itemId;
    groups[k]??={type:m.itemType,id:m.itemId,units:0,revenue:0};
    groups[k].units+=-m.qty;
    groups[k].revenue+=(-m.qty)*(m.unitPrice||0);
  }
  return Object.values(groups).map(x=>({...x,label:itemLabel(x.type,x.id)})).sort((a,b)=>b.units-a.units).slice(0,n);
}
function analyticsSlowMovers(range){

  return state.variants.filter(v=>v.active!==false&&!sold.has("variant:"+v.id))

function salesByRange(range){
  if(!range.valid) return [];
  const monthly=range.monthly;
  const dates=[];
  let cursor=parseISO(range.fromISO), last=parseISO(range.toISO);
  if(monthly) cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  while(cursor<=last){
    dates.push(isoOf(cursor));
    if(monthly) cursor.setMonth(cursor.getMonth()+1); else cursor.setDate(cursor.getDate()+1);
  }
  const map={};
  for(const m of analyticsSalesMovements(range)){
    const day=isoOf(new Date(m.ts));
    const key=monthly?monthKey(m.ts):day;
    map[key]??={revenue:0,units:0};
    map[key].revenue+=(-m.qty)*(m.unitPrice||0);
    map[key].units+=-m.qty;
  }
  return dates.map(date=>{
    const key=monthly?monthKey(parseISO(date).getTime()):date;
    return {date,revenue:round2(map[key]?.revenue||0),units:map[key]?.units||0};
  });
}

function printLabels(){

function countApply(id){
  const c = byId(state.counts, id); if (!c || c.applied) return;
  let n = 0;
  for (const l of c.lines){

    const r = adjustItem(l.itemType, l.itemId, l.counted, "Stock-take — "+c.name);
    if (r.ok) n++;

  c.applied = true;
  save(); closeModal(); render();
  toast(n ? `${n} ${plural(n,"adjustment")} written to the ledger. The shelves and the books agree again.` : "Nothing to adjust — counted matched expected.", {ic:"check"});

/* ============================================================
   15. CHARTS — hand-drawn SVG (donut, bars, horizontal bars, line)
   ============================================================ */
function svgOpen(w, h, cls=""){ return `<svg viewBox="0 0 ${w} ${h}" class="${cls}" role="img" preserveAspectRatio="xMidYMid meet">`; }
function arcPath(cx, cy, r, a0, a1){
  const large = (a1-a0) > Math.PI ? 1 : 0;
  const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
  const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function chartDonut(items){
  const w = 220, h = 190, cx = w/2, cy = h/2, r = 64, sw = 27;
  const total = sumBy(items, x=>x.val);
  if (!items.length || total<=0){
    return svgOpen(w,h)+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--field)" stroke-width="${sw}"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" class="donut-c" style="fill:var(--muted)">—</text></svg>`;
  }
  let a = -Math.PI/2;
  const segs = items.map((x,i)=>{
    const frac = x.val/total;
    const a1 = a + frac*2*Math.PI - 0.02;
    const p = `<path d="${arcPath(cx,cy,r,a,Math.max(a+0.02,a1))}" fill="none" stroke="${catColor(x.cat)}" stroke-width="${sw}">
      <title>${esc(x.cat.name)}: ${money(x.val)} (${Math.round(frac*100)}%)</title></path>`;
    a = a + frac*2*Math.PI;
    return p;
  }).join("");
  return svgOpen(w,h)+segs+`
    <text x="${cx}" y="${cy-3}" text-anchor="middle" class="donut-c">${money0(total).replace(/\.\d+$/,"")}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" class="donut-l">stock value</text></svg>`;
}
function chartBars(data){
  const w = 340, h = 170, padL = 30, padB = 22, padT = 14;
  const max = Math.max(1, ...data.map(d=>Math.max(d.inQty, d.outQty)));
  const iw = (w-padL-8)/data.length;
  const bw = Math.min(7, iw/2.6);
  const plotH = h-padB-padT;
  const y = v => padT + plotH - (v/max)*plotH;
  let bars = "", labels = "";
  data.forEach((d,i)=>{
    const x = padL + i*iw + iw/2;

const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
"221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
"221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
"212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
"231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
"231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
"314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
"112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
"111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
"214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
"114131","311141","411131","211412","211214","211232","2331112"];
const C128_START_B = 104, C128_STOP = 106;
function c128Values(text){
  const chars = String(text).split("").filter(ch => ch.charCodeAt(0) >= 32 && ch.charCodeAt(0) <= 126);
  if (!chars.length) return null;
  const vals = chars.map(ch => ch.charCodeAt(0) - 32);
  let sum = C128_START_B;
  vals.forEach((v,i)=> sum += (i+1)*v);
  return {vals, check: sum % 103};
}
function c128Verify(text){
  const e = c128Values(text);
  if (!e) return false;
  /* structural: every standard pattern is 6 elements / 11 modules (3 bars + 3 spaces), stop is 7 elements / 13 modules */
  const seq = [C128_START_B, ...e.vals, e.check, C128_STOP];
  return seq.every(v => {
    const p = C128[v]; if (!p) return false;
    if (v === C128_STOP) return p.length === 7 && p.split("").reduce((a,b)=>a+Number(b),0) === 13;
    return p.length === 6 && p.split("").reduce((a,b)=>a+Number(b),0) === 11;
  });
}
function barcodeSVG(code, {h=40, scale=1.3, show=true}={}){
  const enc = c128Values(code);
  if (!enc) return `<span class="tiny muted">no barcode</span>`;
  const seq = [C128_START_B, ...enc.vals, enc.check, C128_STOP];
  let modules = 0;
  let rects = "";
  for (const v of seq){
    const pat = C128[v];
    let isBar = true;
    for (const d of pat){
      const n = Number(d);
      if (isBar && n>0) rects += `<rect x="${modules*scale}" y="0" width="${n*scale}" height="${h}" fill="currentColor"/>`;
      modules += n; isBar = !isBar;
    }
  }
  const w = modules*scale;
  const textH = show ? 11 : 0;
  return `<svg class="bc-svg" width="${w+16}" height="${h+textH+8}" viewBox="-8 0 ${w+16} ${h+textH+8}" role="img" aria-label="Barcode ${escAttr(code)}">
    <rect x="-8" y="0" width="${w+16}" height="${h+textH+8}" fill="transparent"/>
    <g transform="translate(0,2)">${rects}</g>
    ${show?`<text x="${w/2}" y="${h+textH}" text-anchor="middle" font-size="9.5">${esc(code)}</text>`:""}
  </svg>`;
}

/* ---------- CSV core ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur="", inQ=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (inQ){
      if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if (c==='"') inQ=true;
      else if (c===","){ row.push(cur); cur=""; }
      else if (c==="\n"||c==="\r"){ if (c==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur="";
        if (row.some(x=>x.trim()!=="")) rows.push(row); row=[]; }
      else cur+=c;
    }
  }
  if (cur!=="" || row.length){ row.push(cur); if (row.some(x=>x.trim()!=="")) rows.push(row); }
  return rows;
}

      const data = {productId:prod.id, name:o.name, barcode:o.barcode||"", price:parseUserNum(o.price), cost:parseUserNum(o.cost),
        reorderPoint:parseUserNum(o.reorderPoint), reorderQty:parseUserNum(o.reorderQty),
        supplierId: state.suppliers.find(s=>s.name.toLowerCase()===String(o.supplier||"").toLowerCase())?.id || ""};
      if (ex){ Object.assign(ex, data); updated++; }
      else { state.variants.push(Object.assign({id:uid("var"), sku:o.sku||skuFromPattern(prod,{name:o.name}), active:true, attrs:{}}, data)); created++; }
    }
  } else {
    for (const o of valid){
      const hit = findItemByCode(o.sku); if (!hit){ skipped++; continue; }
      const kind = o.kind.toLowerCase();
      let q = parseUserNum(o.qty);
      q = (kind==="out"||kind==="consume") ? -Math.abs(q) : Math.abs(q);
      const ts = new Date(o.date); ts.setHours(12,0,0,0);
      state.movements.push({id:uid("mov"), ts: ts.getTime(), kind, reason:o.reason||({in:"Imported delivery",out:"Imported sale",adjust:"Imported adjustment"}[kind]||"Import"),
        itemType: hit.type, itemId: hit.id, qty:q,
        unitCost: o.unitCost===""||o.unitCost==null?null:parseUserNum(o.unitCost),
        unitPrice: o.unitPrice===""||o.unitPrice==null?null:parseUserNum(o.unitPrice),
        channelId: state.channels.find(c=>c.name.toLowerCase()===String(o.channel||"").toLowerCase())?.id || "",
        batchId:null, poId:null, note:o.note||"Imported"});
      created++;
    }
  }
  save(); closeModal(); render();
  toast(`Imported ${created} ${plural(created,"row")}${updated?`, updated ${updated}`:""}${skipped?`, skipped ${skipped}`:""}.`, {ic:"upload"});
  pushUndo("CSV import", ()=>{
    state.products = undoSnapshot.products; state.variants = undoSnapshot.variants;
    state.movements = state.movements.slice(0, undoSnapshot.movementsCount);
    save(); render();
  });
}
/* ---------- JSON backup & restore ---------- */
function exportJSON(){
  persistNow();
  download(`inventory-backup-${todayISO()}.json`, JSON.stringify(state, null, 2), "application/json");
  toast("Backup downloaded — keep it somewhere safe.", {ic:"save"});
}
async function importJSON(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async ()=>{
    const f = inp.files[0]; if (!f) return;
    try {
      const raw = JSON.parse(await readTextFile(f));
      if (!raw || typeof raw !== "object" || (!Array.isArray(raw.products))) throw new Error("bad shape");
      const norm = normalize(raw);
      const ok = await confirmModal({title:"Restore this backup?",
        msg:`It contains <b>${norm.products.length} products</b>, <b>${norm.variants.length} variants</b>, <b>${norm.movements.length} movements</b>. This replaces what is on the device now.`,
        okLabel:"Restore", okIc:"upload"});
      if (!ok) return;
      state = norm; persistNow(); applyTheme(); renderShell(); render();
      toast("Backup restored. Welcome back.", {ic:"check"});
    } catch(e){ toast("That file does not look like an Inventory Tracker backup.", {ic:"warn"}); }
  };
  inp.click();
}

let currentRoute = "dashboard";
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [screen, param] = h.split("/");
  return {screen: screen || "dashboard", param: param && param.startsWith("p:") ? param.slice(2) : ""};
}
function render(){
  const {screen, param} = parseHash();

/* ---------- search overlay ---------- */
function closeSearch(){ const r = $("#searchRoot"); r.hidden = true; r.innerHTML = ""; }
function quickCommand(q){
  q = q.trim();
  let m = q.match(/^sell\s+(\S+?)(?:\s+(\d+))?$/i);
  if (m){ const hit = findItemByCode(m[1]);
    if (hit) return {label:`Sell ${itemLabel(hit.type,hit.id).name}${m[2]?" ×"+m[2]:""}`, ic:"down", run:()=>openStockOutModal(m[1], m[2]||"")}; }
  m = q.match(/^receive\s+(\S+?)(?:\s+(\d+))?$/i);
  if (m){ const hit = findItemByCode(m[1]);
    if (hit) return {label:`Receive ${itemLabel(hit.type,hit.id).name}${m[2]?" ×"+m[2]:""}`, ic:"up",
      run:()=>{ if (m[2]) DRAFT_IN.qty = m[2]; openStockInModal(m[1]); }}; }
  m = q.match(/^(?:go|open)\s+([a-z-]+)/i);
  if (m){ const r = ROUTES.find(r=>r.id.startsWith(m[1].toLowerCase()));
    if (r) return {label:"Go to "+r.label, ic:r.icon, run:()=>location.hash="#"+r.id}; }
  return null;
}
function searchResults(q){
  const runs = []; const out = []; let group = "";
  const push = (g, ic, html, run)=>{
    if (g!==group){ out.push(`<div class="sr-group">${esc(g)}</div>`); group = g; }
    out.push(`<button class="sr-item ${runs.length===0?"sel":""}" type="button" data-sr="${runs.length}">${icon(ic,15)}<span class="grow">${html}</span></button>`);
    runs.push(run);
  };
  const s = q.trim().toLowerCase();
  const qc = quickCommand(q);
  if (qc) push("Quick action", qc.ic, `<b>${esc(qc.label)}</b>`, qc.run);
  const nav = ROUTES.filter(r=>(!state.settings.simpleMode||!r.all) && (!s || r.label.toLowerCase().includes(s) || r.id.includes(s)))
    .slice(0, s?4:7);
  nav.forEach(r=>push("Screens", r.icon, `${esc(r.label)}`, ()=>location.hash="#"+r.id));
  if (s){
    state.products.filter(p=>p.name.toLowerCase().includes(s)||(p.sku||"").toLowerCase().includes(s)).slice(0,5)
      .forEach(p=>push("Products","box", `${esc(p.name)} <small class="sku">${esc(p.sku||"")}</small>`, ()=>location.hash="#products/p:"+p.id));
    state.variants.filter(v=>v.name.toLowerCase().includes(s)||(v.sku||"").toLowerCase().includes(s)||(v.barcode||"").toLowerCase().includes(s)).slice(0,6)
      .forEach(v=>push("Variants","tag", `${esc(itemLabel("variant",v.id).name)} <small class="sku">${esc(v.sku||"")}</small>`, ()=>location.hash="#products/p:"+v.productId));
    state.suppliers.filter(x=>x.name.toLowerCase().includes(s)).slice(0,4)
      .forEach(x=>push("Suppliers","truck", `${esc(x.name)}`, ()=>supplierDetail(x.id)));
    const hit = findItemByCode(s);
    if (hit) push("Exact match","scan", `<b>${esc(itemLabel(hit.type,hit.id).name)}</b> <small>${fmtQty(stockOf(hit.type,hit.id))} on hand</small>`,
      ()=>location.hash="#products/p:"+itemOf(hit.type,hit.id).productId);
  }
  TSTATE.searchRuns = runs;
  if (!out.length) return `<div class="sr-group">Nothing found</div><p class="micro" style="padding:4px 12px">Try a product, SKU, barcode or supplier — or a quick action like <b>sell HW-CND 2</b>.</p>`;
  return out.join("");
}
function openSearch(){
  const root = $("#searchRoot");
  root.hidden = false;
  root.innerHTML = `<div class="search-panel" role="dialog" aria-label="Search">
    <div class="search-input-row">${icon("search",18)}<input id="g_q" placeholder="Search, or try “sell HW-CND 2”…" autocomplete="off" aria-label="Search everything">
      <kbd class="kbd">esc</kbd></div>
    <div class="search-res" id="g_res">${searchResults("")}</div>
    <div class="search-foot"><span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>esc</b> close</span>
      <span class="right">quick actions: sell · receive · go</span></div></div>`;
  const q = $("#g_q");
  q.addEventListener("input", ()=>{ $("#g_res").innerHTML = searchResults(q.value); });
  q.addEventListener("keydown", e=>{
    const items = $$(".sr-item", $("#g_res"));
    if (!items.length) return;
    let i = Math.max(0, items.findIndex(x=>x.classList.contains("sel")));
    if (e.key==="ArrowDown"){ e.preventDefault(); i = (i+1)%items.length; }
    else if (e.key==="ArrowUp"){ e.preventDefault(); i = (i-1+items.length)%items.length; }
    else if (e.key==="Enter"){ e.preventDefault(); const fn = TSTATE.searchRuns[i]; closeSearch(); fn && fn(); return; }
    else return;
    items.forEach(x=>x.classList.remove("sel")); items[i].classList.add("sel");
    items[i].scrollIntoView({block:"nearest"});
  });
  root.onclick = e => { if (e.target === root) closeSearch(); };
  focusMe(q);
}

  channelById(el.dataset.id)?.name||"Channel", snap=>state.movements.some(m=>m.channelId===snap.id)||state.listings.some(l=>l.channelId===snap.id));
/* reorder */
ACTIONS["reorder-create"] = ()=>{
  const sel = $$("#view [data-rsel]").filter(c=>c.checked).map(c=>c.value);
  if (!sel.length){ toast("Tick at least one item to include.", {ic:"info"}); return; }
  const qtyMap = {};
  $$("#view [data-rqty]").forEach(inp=>{ qtyMap[inp.dataset.rqty] = parseUserNum(inp.value, 1); });
  createPOsFromReorder(sel, qtyMap);
};
/* ---------- delegated events ---------- */
document.addEventListener("click", e=>{
  const help = e.target.closest(".help");
  if (help){ help.classList.toggle("open"); return; }
  const tok = e.target.closest("[data-skutok]");
  if (tok){ const inp = $("#sku_pat"); if (inp){ inp.value += tok.dataset.skutok; state.settings.skuPattern = inp.value; save(); updateSkuPreview(); } return; }
  const sr = e.target.closest("[data-sr]");
  if (sr){ const fn = TSTATE.searchRuns?.[Number(sr.dataset.sr)]; closeSearch(); fn && fn(); return; }
  if (e.target.closest("[data-tpage],th[data-sort]")){ handleTableEvent(e); return; }
  const per = e.target.closest("[data-period]");
  if (per){
    const period = TSTATE.period ||= {k:"30",from:"",to:""};
    period.k = per.dataset.period;
    if (period.k === "custom"){
      period.from ||= addDaysISO(todayISO(),-29);
      period.to ||= todayISO();
    }
    render(); return;
  }
  const tp = e.target.closest("[data-theme-pick]");
  if (tp){ state.settings.theme = tp.dataset.themePick; save(); applyTheme(); render(); toast("Theme updated.",{ic:"check",ms:1300}); return; }
  const mp = e.target.closest("[data-mode-pick]");
  if (mp){ state.settings.mode = mp.dataset.modePick; save(); applyTheme(); render(); toast(`Colour mode: ${mp.dataset.modePick}.`,{ic:"check",ms:1300}); return; }
  const t = e.target.closest("[data-action]");
  if (t){ const fn = ACTIONS[t.dataset.action]; if (fn){ if (t.tagName==="A") e.preventDefault(); fn(t, e); return; } }
  if (e.target.closest("#sheetBackdrop")) closeSheet();
  if (e.target.closest("#searchRoot") && !e.target.closest(".search-panel")) closeSearch();
});
document.addEventListener("input", e=>{
  if (e.target.closest("[data-tsearch]")){ handleTableEvent(e); return; }
  const di = e.target.closest("[data-di]");
  if (di){ DRAFT_IN[di.dataset.di] = e.target.value; return; }
  if (e.target.matches("[data-skupat]")){ state.settings.skuPattern = e.target.value; save(); updateSkuPreview(); return; }
});
document.addEventListener("change", e=>{
  const set = e.target.closest("[data-set]");
  if (set){
    const k = set.dataset.set;
    let v = set.type==="checkbox" ? set.checked : set.value;
    if (["lowDefault","expiryWarnDays","taxRate"].includes(k)) v = parseUserNum(v);
    state.settings[k] = v; save();
    if (k==="currency"){ _moneyCur = ""; _moneyFmt = null; _moneyDec = -1; }
    if (["simpleMode","currency","businessName","helpOn","expiryWarnDays"].includes(k)){ render(); return; }
    renderFoot();
    return;
  }
  const filt = e.target.closest("[data-filter]");
  if (filt){ PF()[filt.dataset.filter] = filt.value; render(); return; }
  const vs = e.target.closest("[data-vset]");
  if (vs){ const v = variantById(vs.dataset.id); if (v){ v[vs.dataset.vset] = parseUserNum(vs.value); save(); renderFoot(); toast("Saved.",{ic:"check",ms:1400}); } return; }
  const ms = e.target.closest("[data-mset]");
  if (ms){ const m = materialById(ms.dataset.id); if (m){ m[ms.dataset.mset] = parseUserNum(ms.value); save(); renderFoot(); toast("Saved.",{ic:"check",ms:1400}); } return; }
  const rq = e.target.closest("[data-rqty]");
  if (rq){ (TSTATE.reorderQty ||= {})[rq.dataset.rqty] = parseUserNum(rq.value, 1); render(); return; }
  const cc = e.target.closest("[data-costch]");
  if (cc){ TSTATE.costChannel = cc.value; render(); return; }
  const wif = e.target.closest("[data-wif]");
  if (wif){ TSTATE.whatIf = wif.value; render(); return; }
  const pf = e.target.closest("[data-pfrom]"); if (pf){ const period = TSTATE.period ||= {k:"custom",from:"",to:""}; period.from = pf.value; period.k="custom"; render(); return; }
  const pt = e.target.closest("[data-pto]"); if (pt){ const period = TSTATE.period ||= {k:"custom",from:"",to:""}; period.to = pt.value; period.k="custom"; render(); return; }
  const ll = e.target.closest("[data-lablayout]"); if (ll){ TSTATE.labelLayout = ll.value; render(); return; }
  const lc = e.target.closest("[data-labcopies]"); if (lc){ TSTATE.labelCopies = clamp(Math.floor(parseUserNum(lc.value,1)),1,50); render(); return; }
  const lp = e.target.closest("[data-labprice]"); if (lp){ TSTATE.labelPrice = lp.checked; render(); return; }
  const ls = e.target.closest("[data-labsel]");
  if (ls){ (TSTATE.labelSel ||= {}); if (ls.checked) TSTATE.labelSel[ls.dataset.labsel] = true; else delete TSTATE.labelSel[ls.dataset.labsel]; render(); return; }
  const lo = e.target.closest("select[data-lo][data-k='id']");
  if (lo){
    const i = Number(lo.dataset.lo);
    const [type,id] = lo.value.split(":");
    DRAFT_OUT[i] = Object.assign(DRAFT_OUT[i]||{}, {type, id});
    if (type==="variant" && !DRAFT_OUT[i].price){ const v = variantById(id); if (v) DRAFT_OUT[i].price = String(v.price||""); }
    render(); return;
  }
  const lin = e.target.closest("[data-lo][data-k]");
  if (lin && lin.dataset.k){ const i = Number(lin.dataset.lo); if (DRAFT_OUT[i]) { DRAFT_OUT[i][lin.dataset.k] = lin.value; if (lin.dataset.k==="channel") render(); } return; }
  const rs = e.target.closest("[data-rsel]"); if (rs){ (TSTATE.reorderSel ||= {})[rs.value] = rs.checked; return; }
  const pof = e.target.closest("[data-pof]");
  if (pof){ TSTATE.poFilter = pof.dataset.pof; render(); return; }
});
document.addEventListener("keydown", e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){
    e.preventDefault();
    $("#searchRoot").hidden ? openSearch() : closeSearch();
    return;
  }
  if (e.key==="Escape"){
    if (!$("#searchRoot").hidden) closeSearch();
    else if (!$("#modalRoot").hidden) closeModal();
    else closeSheet();
  }
});
window.addEventListener("hashchange", render);

/* ---------- self-test + init ---------- */
function selfTest(){
  try {
    const checks = {
      code128: ["ABC-123","12345","HARBOR-WICK","4-0123-X"].every(c128Verify),
      code128Checksum: c128Values("A").check === 34 && c128Values("HELLO").check === (104+1*40+2*37+3*44+4*44+5*47)%103, /* HELLO → 40 */
      csvRoundtrip: parseCSV(toCSV([["a","b,1"],["q\"uote","line\nbreak"]])).length===2,
      normalize: normalize(defaultState()).version===APP_VERSION,
      ledger: stockOf("variant","nonexistent")===0,
    };
    console.info("[Inventory Tracker] self-test:", checks.all = Object.values(checks).every(Boolean), checks);
  } catch(err){ console.warn("[Inventory Tracker] self-test error:", err); }
}
function init(){
  const loaded = loadState();
  if (loaded){ state = loaded; }
  else {
    state = sampleData();
    persistNow();
  }
  applyTheme();
  render();
  selfTest();
  const wasPrint = ()=>document.body.classList.remove("printing");
  window.addEventListener("afterprint", wasPrint);
}
init();
</script>
</body>
